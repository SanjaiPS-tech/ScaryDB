[package]
name = "scarydb"
version = "0.1.0"
edition = "2021"
default-run = "scarydb"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }
lazy_static = "1.5.0"
parking_lot = "0.12"
crossbeam-channel = "0.5"

[[bin]]
name = "benchmark"
path = "src/bin/benchmark.rs"
