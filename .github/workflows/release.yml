# ScaryDB Cross-Platform CI/CD Pipeline
# Builds, tests, and releases for Linux, macOS, and Windows

name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag (e.g., v0.1.0)'
        required: true
      prerelease:
        description: 'Mark as pre-release'
        type: boolean
        default: false

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  # Build and test matrix
  build-test:
    name: Build & Test (${{ matrix.os }}, ${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux x86_64
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact_name: scarydb-linux-x86_64
          # Linux ARM64
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            artifact_name: scarydb-linux-arm64
            cross: true
          # macOS x86_64 (Intel)
          - os: macos-latest
            target: x86_64-apple-darwin
            artifact_name: scarydb-macos-x86_64
          # macOS ARM64 (Apple Silicon)
          - os: macos-14
            target: aarch64-apple-darwin
            artifact_name: scarydb-macos-arm64
          # Windows x86_64 (MinGW)
          - os: windows-latest
            target: x86_64-pc-windows-gnu
            artifact_name: scarydb-windows-x86_64
          # Windows x86_64 (MSVC)
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact_name: scarydb-windows-msvc

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cross (for cross-compilation)
        if: matrix.cross == 'true'
        uses: taiki-e/install-action@cross

      - name: Cache cargo dependencies
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            gcc-aarch64-linux-gnu \
            libc6-dev-arm64-cross \
            pkg-config \
            libssl-dev

      - name: Install system dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install openssl

      - name: Build project
        run: |
          if [ "${{ matrix.cross }}" = "true" ]; then
            cross build --release --target ${{ matrix.target }} --bin scarydb --bin benchmark
          else
            cargo build --release --target ${{ matrix.target }} --bin scarydb --bin benchmark
          fi

      - name: Run tests
        run: |
          if [ "${{ matrix.cross }}" = "true" ]; then
            cross test --release --target ${{ matrix.target }}
          else
            cargo test --release --target ${{ matrix.target }}
          fi

      - name: Verify binary
        run: |
          BINARY="target/${{ matrix.target }}/release/scurydb"
          if [ "${{ matrix.target }}" = "x86_64-pc-windows-gnu" ] || [ "${{ matrix.target }}" = "x86_64-pc-windows-msvc" ]; then
            BINARY="${BINARY}.exe"
          fi
          if [ ! -f "$BINARY" ]; then
            echo "Binary not found: $BINARY"
            exit 1
          fi
          echo "Binary size: $(du -h $BINARY | cut -f1)"
          $BINARY --version || true

      - name: Generate SBOM
        uses: anchore/sbom-action@v0
        with:
          path: target/${{ matrix.target }}/release/
          format: spdx-json
          output-file: sbom-${{ matrix.target }}.json

      - name: Upload SBOM
        uses: actions/upload-artifact@v4
        with:
          name: sbom-${{ matrix.target }}
          path: sbom-${{ matrix.target }}.json
          retention-days: 7

      - name: Create distribution package
        run: |
          chmod +x package.sh
          ./package.sh --target ${{ matrix.target }} --mode release --output dist

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: |
            dist/scurydb-*-${{ matrix.target }}/**/*
            !dist/*.tar.gz
            !dist/*.zip
          retention-days: 7

  # Create release
  release:
    name: Create GitHub Release
    needs: build-test
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    permissions:
      contents: write
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: false

      - name: Prepare release assets
        run: |
          mkdir -p release-assets
          for dir in artifacts/*/; do
            if [ -d "$dir" ]; then
              platform=$(basename "$dir")
              echo "Processing $platform..."
              # Create archives for each platform
              cd "$dir"
              if [[ "$platform" == *"windows"* ]]; then
                zip -r "../../release-assets/scurydb-${{ github.ref_name }}-${platform}.zip" .
              else
                tar -czf "../../release-assets/scurydb-${{ github.ref_name }}-${platform}.tar.gz" .
              fi
              cd - >/dev/null
            fi
          done

      - name: Generate checksums
        run: |
          cd release-assets
          sha256sum * > checksums.txt
          cat checksums.txt

      - name: Sign artifacts with cosign
        uses: sigstore/cosign-installer@v3
      - name: Sign release artifacts
        if: env.COSIGN_PRIVATE_KEY != ''
        run: |
          cd release-assets
          for file in *; do
            if [ -f "$file" ]; then
              cosign sign-blob --yes --output-signature "${file}.sig" "$file"
            fi
          done

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ github.ref_name }}
          name: ScaryDB ${{ github.ref_name }}
          draft: false
          prerelease: ${{ github.event.inputs.prerelease || false }}
          generate_release_notes: true
          files: |
            release-assets/*
            release-assets/*.sig
            artifacts/*/README.md
            artifacts/*/LICENSE*
            artifacts/*/CHANGELOG.md
            sbom-*.json

  # Publish to package managers (optional, manual trigger)
  publish-homebrew:
    name: Publish to Homebrew
    needs: release
    runs-on: ubuntu-latest
    if: false  # Set to true when ready, or use workflow_dispatch
    steps:
      - name: Checkout homebrew tap
        uses: actions/checkout@v4
        with:
          repository: SanjaiPS-tech/homebrew-scarydb
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}

      - name: Update formula
        run: |
          # This would update the formula with new version and SHA256
          echo "Homebrew publishing not yet configured"

  publish-chocolatey:
    name: Publish to Chocolatey
    needs: release
    runs-on: windows-latest
    if: false  # Set to true when ready, or use workflow_dispatch
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Publish to Chocolatey
        run: |
          # This would publish the Chocolatey package
          echo "Chocolatey publishing not yet configured"

  # Docker image build (optional)
  docker:
    name: Build Docker Image
    needs: build-test
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            sanjaips/scarydb:${{ github.ref_name }}
            sanjaips/scarydb:latest
          platforms: linux/amd64,linux/arm64
          cache-from: type=gha
          cache-to: type=gha,mode=max