          {
            "model": "nvidia/nemotron-3-ultra-550b-a55b",
            "messages": [
              {"role": "system", "content": "$(cat docs_prompt.txt | sed ':a;N;$!ba;s/\n/\\n/g' | sed 's/"/\\"/g')"},
              {"role": "user", "content": "Doc coverage:\n$(cat doc_coverage.txt 2>/dev/null | sed ':a;N;$!ba;s/\n/\\n/g' | sed 's/"/\\"/g')\n\nMarkdown docs:\n$(cat markdown_docs.txt 2>/dev/null | head -300 | sed ':a;N;$!ba;s/\n/\\n/g' | sed 's/"/\\"/g')\n\nRust doc comments:\n$(cat rust_docs.txt 2>/dev/null | head -200 | sed ':a;N;$!ba;s/\n/\\n/g' | sed 's/"/\\"/g')"}
            ],
            "temperature": 0.4,
            "max_tokens": 4000
          }
          PAYLOAD

      - name: Create Documentation Issue
        if: env.NVIDIA_API_KEY != ''
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const analysis = JSON.parse(fs.readFileSync('docs_analysis.json', 'utf8'));
            const content = analysis.choices?.[0]?.message?.content || 'No analysis generated';
            const { data: issue } = await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `📚 AI Documentation Analysis - ${new Date().toISOString().split('T')[0]}`,
              body: content,
              labels: ['documentation', 'ai-generated', 'maintenance']
            });
            console.log(`Created issue #${issue.number}`);

      - name: Upload Documentation Analysis
        uses: actions/upload-artifact@v4
        with:
          name: ai-documentation-analysis
          path: |
            docs_analysis.json
            doc_coverage.txt
            markdown_docs.txt
            rust_docs.txt
          retention-days: 90

  ai-supervisor:
    name: AI Maintenance Supervisor (Meta-Agent)
    runs-on: ubuntu-latest
    if: github.event.inputs.maintenance_type == 'ai-supervisor' || github.event.inputs.maintenance_type == 'all-ai' || github.event.schedule == '0 4 * * 6'
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-ai-supervisor-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-ai-supervisor-

      - name: Collect all maintenance data
        run: |
          # Run quick checks to gather data for supervisor
          cargo check --all-features 2>&1 | tee cargo_check.txt || true
          cargo clippy --all-targets --all-features -- -D warnings 2>&1 | head -50 > clippy_summary.txt || true
          cargo test --all-features -- --test-threads=4 2>&1 | tail -30 > test_summary.txt || true
          cargo build --release --all-features 2>&1 | tail -10 > build_summary.txt || true
          
          # Quick benchmark (1 run)
          ./target/release/benchmark 2>&1 | tee quick_bench.txt || true
          
          # Security audit
          cargo install cargo-audit --locked 2>/dev/null || true
          cargo audit --json > audit_report.json 2>&1 || true
          
          # Documentation coverage
          cargo install cargo-doc-coverage --locked 2>/dev/null || true
          cargo doc-coverage 2>&1 | tee doc_coverage.txt || true
          
          # Dead code
          cargo install cargo-machete --locked 2>/dev/null || true
          cargo machete 2>&1 | tee dead_code.txt || true
          
          # Unsafe code
          grep -r "unsafe" src/ --include="*.rs" | head -30 > unsafe_usage.txt || true
          
          # Dependencies
          cargo install cargo-outdated --locked 2>/dev/null || true
          cargo outdated --root-deps-only 2>&1 | tee outdated_deps.txt || true

      - name: AI Supervisor Analysis
        if: env.NVIDIA_API_KEY != ''
        env:
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
        run: |
          cat > supervisor_prompt.txt << 'EOF'
          You are the AI Maintenance Supervisor - a meta-agent that oversees all other AI maintenance agents.
          Your job is to synthesize findings from all maintenance domains and produce a unified action plan.

          Analyze the comprehensive data and provide:
          1. EXECUTIVE SUMMARY - Overall health score (0-100) and top 3 risks
          2. CROSS-CUTTING CONCERNS - Issues that span multiple domains (security+perf, tests+docs, etc.)
          3. PRIORITIZED ROADMAP - Top 10 actions across ALL domains with effort/impact matrix
          4. RESOURCE ALLOCATION - Suggested focus areas for the team this sprint
          5. AGENT COORDINATION - Which sub-agents should run more/less frequently
          6. AUTOMATION OPPORTUNITIES - What can be fully automated vs needs human review

          Output as a comprehensive markdown report with:
          - Health dashboard (tables)
          - Priority matrix (effort vs impact)
          - Sprint planning recommendations
          - Agent schedule optimization
          EOF

          curl -s -X POST "https://integrate.api.nvidia.com/v1/chat/completions" \
            -H "Authorization: Bearer ${NVIDIA_API_KEY}" \
            -H "Content-Type: application/json" \
            -d @- << PAYLOAD > supervisor_analysis.json
          {
            "model": "nvidia/nemotron-3-ultra-550b-a55b",
            "messages": [
              {"role": "system", "content": "$(cat supervisor_prompt.txt | sed ':a;N;$!ba;s/\n/\\n/g' | sed 's/"/\\"/g')"},
              {"role": "user", "content": "Cargo check:\n$(cat cargo_check.txt 2>/dev/null | tail -20 | sed ':a;N;$!ba;s/\n/\\n/g' | sed 's/"/\\"/g')\n\nClippy summary:\n$(cat clippy_summary.txt 2>/dev/null | sed ':a;N;$!ba;s/\n/\\n/g' | sed 's/"/\\"/g')\n\nTest summary:\n$(cat test_summary.txt 2>/dev/null | sed ':a;N;$!ba;s/\n/\\n/g' | sed 's/"/\\"/g')\n\nBuild summary:\n$(cat build_summary.txt 2>/dev/null | sed ':a;N;$!ba;s/\n/\\n/g' | sed 's/"/\\"/g')\n\nQuick benchmark:\n$(cat quick_bench.txt 2>/dev/null | sed ':a;N;$!ba;s/\n/\\n/g' | sed 's/"/\\"/g')\n\nSecurity audit:\n$(cat audit_report.json 2>/dev/null | sed ':a;N;$!ba;s/\n/\\n/g' | sed 's/"/\\"/g')\n\nDoc coverage:\n$(cat doc_coverage.txt 2>/dev/null | sed ':a;N;$!ba;s/\n/\\n/g' | sed 's/"/\\"/g')\n\nDead code:\n$(cat dead_code.txt 2>/dev/null | sed ':a;N;$!ba;s/\n/\\n/g' | sed 's/"/\\"/g')\n\nUnsafe usage:\n$(cat unsafe_usage.txt 2>/dev/null | sed ':a;N;$!ba;s/\n/\\n/g' | sed 's/"/\\"/g')\n\nOutdated deps:\n$(cat outdated_deps.txt 2>/dev/null | sed ':a;N;$!ba;s/\n/\\n/g' | sed 's/"/\\"/g')"}
            ],
            "temperature": 0.3,
            "max_tokens": 4000
          }
          PAYLOAD

      - name: Create Supervisor Master Issue
        if: env.NVIDIA_API_KEY != ''
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const analysis = JSON.parse(fs.readFileSync('supervisor_analysis.json', 'utf8'));
            const content = analysis.choices?.[0]?.message?.content || 'No analysis generated';
            const { data: issue } = await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `🎯 AI Maintenance Supervisor Report - ${new Date().toISOString().split('T')[0]}`,
              body: content,
              labels: ['supervisor', 'ai-generated', 'maintenance', 'meta']
            });
            console.log(`Created master issue #${issue.number}`);

      - name: Upload Supervisor Analysis
        uses: actions/upload-artifact@v4
        with:
          name: ai-supervisor-analysis
          path: |
            supervisor_analysis.json
            cargo_check.txt
            clippy_summary.txt
            test_summary.txt
            build_summary.txt
            quick_bench.txt
            audit_report.json
            doc_coverage.txt
            dead_code.txt
            unsafe_usage.txt
            outdated_deps.txt
          retention-days: 90

  all-ai:
    name: Run All AI Maintenance Agents
    runs-on: ubuntu-latest
    if: github.event.inputs.maintenance_type == 'all-ai'
    timeout-minutes: 150
    needs: [ai-code-review, ai-refactor, ai-security, ai-perf, ai-tests, ai-docs, ai-supervisor, ai-repair, ai-fix-tests]
    steps:
      - name: Aggregate All AI Reports
        run: |
          echo "## 🤖 All AI Maintenance Agents Completed" > all_ai_summary.md
          echo "" >> all_ai_summary.md
          echo "**Date:** $(date -u +"%Y-%m-%d %H:%M:%S UTC")" >> all_ai_summary.md
          echo "**Commit:** $(git rev-parse --short HEAD 2>/dev/null || echo 'N/A')" >> all_ai_summary.md
          echo "" >> all_ai_summary.md
          echo "### Jobs Executed" >> all_ai_summary.md
          echo "- ✅ AI Code Review" >> all_ai_summary.md
          echo "- ✅ AI Refactoring Analysis" >> all_ai_summary.md
          echo "- ✅ AI Security Analysis" >> all_ai_summary.md
          echo "- ✅ AI Performance Analysis" >> all_ai_summary.md
          echo "- ✅ AI Test Analysis & Generation" >> all_ai_summary.md
          echo "- ✅ AI Documentation Analysis" >> all_ai_summary.md
          echo "- ✅ AI Maintenance Supervisor (Meta-Agent)" >> all_ai_summary.md
          echo "- ✅ AI Code Repair (Auto-Fix)" >> all_ai_summary.md
          echo "- ✅ AI Test Fix & Generation" >> all_ai_summary.md
          echo "" >> all_ai_summary.md
          echo "### Artifacts Available" >> all_ai_summary.md
          echo "Each job uploaded its analysis as artifacts. Download from the workflow run." >> all_ai_summary.md
          echo "" >> all_ai_summary.md
          echo "### Master Issue" >> all_ai_summary.md
          echo "The AI Supervisor created a master issue with unified action plan." >> all_ai_summary.md
          cat all_ai_summary.md

      - name: Upload Aggregated Summary
        uses: actions/upload-artifact@v4
        with:
          name: all-ai-maintenance-summary
          path: all_ai_summary.md
          retention-days: 90

  ai-repair:
    name: AI Code Repair (Auto-Fix)
    runs-on: ubuntu-latest
    if: github.event.inputs.maintenance_type == 'ai-repair' || github.event.schedule == '0 4 * * 2'
    timeout-minutes: 60
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-ai-repair-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-ai-repair-

      - name: Run cargo fix (auto-fix clippy warnings)
        run: |
          cargo fix --all-targets --all-features --allow-dirty --allow-staged 2>&1 | tee cargo_fix.txt || true
          cargo fix --all-targets --all-features --edition --allow-dirty --allow-staged 2>&1 | tee cargo_fix_edition.txt || true

      - name: Run clippy to identify remaining issues
        run: |
          cargo clippy --all-targets --all-features -- -D warnings 2>&1 | tee clippy_after_fix.txt || true

      - name: Run tests to verify fixes
        run: |
          cargo test --all-features -- --test-threads=4 2>&1 | tee test_after_fix.txt || true

      - name: AI Repair Analysis
        if: env.NVIDIA_API_KEY != ''
        env:
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
        run: |
          cat > repair_prompt.txt << 'EOF'
          You are a Rust expert performing automated code repair. Analyze the following data and provide:
          1. Summary of fixes applied by cargo fix
          2. Remaining clippy warnings that need manual attention
          3. Test results after fixes (pass/fail)
          4. Any breaking changes or risky fixes
          5. Additional automated fixes that could be applied
          6. Manual fixes needed with code examples

          Output as actionable markdown with code diffs where applicable.
          EOF

          curl -s -X POST "https://integrate.api.nvidia.com/v1/chat/completions" \
            -H "Authorization: Bearer ${NVIDIA_API_KEY}" \
            -H "Content-Type: application/json" \
            -d @- << PAYLOAD > repair_analysis.json
          {
            "model": "nvidia/nemotron-3-ultra-550b-a55b",
            "messages": [
              {"role": "system", "content": "$(cat repair_prompt.txt | sed ':a;N;$!ba;s/\n/\\n/g' | sed 's/"/\\"/g')"},
              {"role": "user", "content": "Cargo fix output:\n$(cat cargo_fix.txt 2>/dev/null | sed ':a;N;$!ba;s/\n/\\n/g' | sed 's/"/\\"/g')\n\nCargo fix edition output:\n$(cat cargo_fix_edition.txt 2>/dev/null | sed ':a;N;$!ba;s/\n/\\n/g' | sed 's/"/\\"/g')\n\nClippy after fix:\n$(cat clippy_after_fix.txt 2>/dev/null | head -100 | sed ':a;N;$!ba;s/\n/\\n/g' | sed 's/"/\\"/g')\n\nTests after fix:\n$(cat test_after_fix.txt 2>/dev/null | tail -30 | sed ':a;N;$!ba;s/\n/\\n/g' | sed 's/"/\\"/g')"}
            ],
            "temperature": 0.2,
            "max_tokens": 4000
          }
          PAYLOAD

      - name: Create Repair PR
        if: env.NVIDIA_API_KEY != ''
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const analysis = JSON.parse(fs.readFileSync('repair_analysis.json', 'utf8'));
            const content = analysis.choices?.[0]?.message?.content || 'No analysis generated';
            
            // Check if there are actual changes
            const { stdout: diff } = await import('child_process').then(cp => cp.execSync('git diff --stat', { encoding: 'utf8' }));
            
            if (diff.trim()) {
              // Create branch and PR
              const branchName = `ai-repair-${Date.now()}`;
              await import('child_process').then(cp => cp.execSync(`git config user.name "github-actions[bot]"`));
              await import('child_process').then(cp => cp.execSync(`git config user.email "41898282+github-actions[bot]@users.noreply.github.com"`));
              await import('child_process').then(cp => cp.execSync(`git checkout -b ${branchName}`));
              await import('child_process').then(cp => cp.execSync(`git add -A`));
              await import('child_process').then(cp => cp.execSync(`git commit -m "chore: automated AI code repairs [skip ci]"`));
              await import('child_process').then(cp => cp.execSync(`git push origin ${branchName}`));
              
              const { data: pr } = await github.rest.pulls.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: `🤖 Automated AI Code Repairs - ${new Date().toISOString().split('T')[0]}`,
                head: branchName,
                base: 'main',
                body: `## Automated Code Repairs\n\n${content}\n\n---\n*Generated by AI Repair Agent*`
              });
              console.log(`Created PR #${pr.number}`);
            } else {
              console.log('No changes to commit');
            }

      - name: Upload Repair Analysis
        uses: actions/upload-artifact@v4
        with:
          name: ai-repair-analysis
          path: |
            repair_analysis.json
            cargo_fix.txt
            cargo_fix_edition.txt
            clippy_after_fix.txt
            test_after_fix.txt
          retention-days: 90

  ai-fix-tests:
    name: AI Test Fix & Generation
    runs-on: ubuntu-latest
    if: github.event.inputs.maintenance_type == 'ai-fix-tests' || github.event.schedule == '0 4 * * 4'
    timeout-minutes: 60
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-ai-testfix-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-ai-testfix-

      - name: Run tests and capture failures
        run: |
          cargo test --all-features -- --test-threads=4 2>&1 | tee test_output.txt || true

      - name: Run tests with nextest for better output
        run: |
          cargo install cargo-nextest --locked 2>/dev/null || true
          cargo nextest run --all-features 2>&1 | tee nextest_output.txt || true

      - name: Collect failing tests
        run: |
          grep -E "(FAILED|failed|panicked)" test_output.txt nextest_output.txt 2>/dev/null | head -50 > failing_tests.txt || true
          cargo test --all-features -- --list 2>&1 | grep "test " | head -100 > all_tests.txt || true

      - name: AI Test Fix & Generation
        if: env.NVIDIA_API_KEY != ''
        env:
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
        run: |
          cat > testfix_prompt.txt << 'EOF'
          You are a Rust testing expert. Analyze the test failures and provide:
          1. Root cause analysis for each failing test
          2. Fixed test code for each failure
          3. New test cases to add for uncovered code paths
          4. Flaky test identification and fixes
          5. Test infrastructure improvements
          6. Property-based test suggestions (proptest)

          Output as actionable markdown with complete test code replacements.
          EOF

          curl -s -X POST "https://integrate.api.nvidia.com/v1/chat/completions" \
            -H "Authorization: Bearer ${NVIDIA_API_KEY}" \
            -H "Content-Type: application/json" \
            -d @- << PAYLOAD > testfix_analysis.json
          {
            "model": "nvidia/nemotron-3-ultra-550b-a55b",
            "messages": [
              {"role": "system", "content": "$(cat testfix_prompt.txt | sed ':a;N;$!ba;s/\n/\\n/g' | sed 's/"/\\"/g')"},
              {"role": "user", "content": "Test output (failures):\n$(cat test_output.txt 2>/dev/null | tail -100 | sed ':a;N;$!ba;s/\n/\\n/g' | sed 's/"/\\"/g')\n\nNextest output:\n$(cat nextest_output.txt 2>/dev/null | tail -100 | sed ':a;N;$!ba;s/\n/\\n/g' | sed 's/"/\\"/g')\n\nFailing tests:\n$(cat failing_tests.txt 2>/dev/null | sed ':a;N;$!ba;s/\n/\\n/g' | sed 's/"/\\"/g')\n\nAll tests:\n$(cat all_tests.txt 2>/dev/null | sed ':a;N;$!ba;s/\n/\\n/g' | sed 's/"/\\"/g')"}
            ],
            "temperature": 0.3,
            "max_tokens": 4000
          }
          PAYLOAD

      - name: Create Test Fix PR
        if: env.NVIDIA_API_KEY != ''
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const analysis = JSON.parse(fs.readFileSync('testfix_analysis.json', 'utf8'));
            const content = analysis.choices?.[0]?.message?.content || 'No analysis generated';
            
            // Create PR with test fixes
            const branchName = `ai-testfix-${Date.now()}`;
            await import('child_process').then(cp => cp.execSync(`git config user.name "github-actions[bot]"`));
            await import('child_process').then(cp => cp.execSync(`git config user.email "41898282+github-actions[bot]@users.noreply.github.com"`));
            await import('child_process').then(cp => cp.execSync(`git checkout -b ${branchName}`));
            
            // The AI analysis would contain test code - in practice you'd parse and apply it
            // For now, create an issue with the analysis
            const { data: issue } = await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `🧪 AI Test Fixes & Generation - ${new Date().toISOString().split('T')[0]}`,
              body: content,
              labels: ['testing', 'ai-generated', 'maintenance']
            });
            console.log(`Created issue #${issue.number}`);

      - name: Upload Test Fix Analysis
        uses: actions/upload-artifact@v4
        with:
          name: ai-testfix-analysis
          path: |
            testfix_analysis.json
            test_output.txt
            nextest_output.txt
            failing_tests.txt
            all_tests.txt
          retention-days: 90