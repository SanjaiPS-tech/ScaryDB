name: Scheduled Maintenance

on:
  schedule:
    # Run daily at 2 AM UTC
    - cron: '0 2 * * *'
    # Run weekly deep maintenance on Sundays at 3 AM UTC
    - cron: '0 3 * * 0'
    # AI Refactoring Analysis - Weekly on Sundays at 5 AM UTC
    - cron: '0 5 * * 0'
    # AI Security Analysis - Daily at 3 AM UTC
    - cron: '0 3 * * *'
    # AI Performance Analysis - Weekly on Mondays at 4 AM UTC
    - cron: '0 4 * * 1'
    # AI Test Analysis - Weekly on Wednesdays at 4 AM UTC
    - cron: '0 4 * * 3'
    # AI Documentation Analysis - Weekly on Fridays at 4 AM UTC
    - cron: '0 4 * * 5'
    # AI Maintenance Supervisor - Weekly on Saturdays at 4 AM UTC
    - cron: '0 4 * * 6'
    # AI Code Repair - Weekly on Tuesdays at 4 AM UTC
    - cron: '0 4 * * 2'
    # AI Test Fix - Weekly on Thursdays at 4 AM UTC
    - cron: '0 4 * * 4'
  workflow_dispatch:
    inputs:
      maintenance_type:
        description: 'Type of maintenance to run'
        required: true
        default: 'daily'
        type: choice
        options:
          - 'daily'
          - 'weekly'
          - 'security'
          - 'dependency-update'
          - 'ai-review'
          - 'ai-refactor'
          - 'ai-security'
          - 'ai-perf'
          - 'ai-tests'
          - 'ai-docs'
          - 'ai-supervisor'
          - 'all-ai'
          - 'ai-repair'
          - 'ai-fix-tests'

env:
  CARGO_TERM_COLOR: always

jobs:
  daily-maintenance:
    name: Daily Maintenance
    runs-on: ubuntu-latest
    if: github.event.schedule == '0 2 * * *' || github.event.inputs.maintenance_type == 'daily'
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-maintenance-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-maintenance-

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Run tests
        run: cargo test --all-features -- --test-threads=4

      - name: Build release
        run: cargo build --release --all-features

      - name: Check for outdated dependencies
        run: |
          cargo install cargo-outdated --locked 2>/dev/null || true
          cargo outdated --root-deps-only || true

      - name: Security audit
        run: |
          cargo install cargo-audit --locked 2>/dev/null || true
          cargo audit || true

      - name: Create maintenance summary
        run: |
          echo "## 🔧 Daily Maintenance Report" > maintenance_summary.md
          echo "" >> maintenance_summary.md
          echo "**Date:** $(date -u +"%Y-%m-%d %H:%M:%S UTC")" >> maintenance_summary.md
          echo "**Commit:** $(git rev-parse --short HEAD)" >> maintenance_summary.md
          echo "**Branch:** ${{ github.ref_name }}" >> maintenance_summary.md
          echo "" >> maintenance_summary.md
          echo "### ✅ Checks Passed" >> maintenance_summary.md
          echo "- Formatting" >> maintenance_summary.md
          echo "- Clippy lints" >> maintenance_summary.md
          echo "- Unit & integration tests" >> maintenance_summary.md
          echo "- Release build" >> maintenance_summary.md
          echo "- Security audit" >> maintenance_summary.md
          echo "" >> maintenance_summary.md
          echo "### 📦 Dependency Status" >> maintenance_summary.md
          cargo outdated --root-deps-only 2>/dev/null | head -20 >> maintenance_summary.md || echo "No outdated dependencies found" >> maintenance_summary.md

      - name: Upload maintenance report
        uses: actions/upload-artifact@v4
        with:
          name: daily-maintenance-report
          path: maintenance_summary.md
          retention-days: 90

  weekly-maintenance:
    name: Weekly Deep Maintenance
    runs-on: ubuntu-latest
    if: github.event.schedule == '0 3 * * 0' || github.event.inputs.maintenance_type == 'weekly'
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-weekly-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-weekly-

      - name: Run full test suite with all features
        run: cargo test --all-features -- --test-threads=4

      - name: Run benchmarks
        run: |
          cargo build --release --all-features
          for i in {1..3}; do
            echo "=== Benchmark run $i ==="
            ./target/release/benchmark 2>&1 | tee -a weekly_benchmark.txt
          done

      - name: Check for dead code
        run: |
          cargo install cargo-machete --locked 2>/dev/null || true
          cargo machete || true

      - name: Check MSRV compatibility
        run: |
          rustup install 1.70
          cargo +1.70 build --all-features 2>&1 | tee msrv_check.txt || true

      - name: Generate documentation
        run: cargo doc --all-features --no-deps

      - name: Check documentation coverage
        run: |
          cargo install cargo-doc-coverage --locked 2>/dev/null || true
          cargo doc-coverage 2>&1 | tee doc_coverage.txt || true

      - name: Create weekly summary
        run: |
          echo "## 📅 Weekly Maintenance Report" > weekly_summary.md
          echo "" >> weekly_summary.md
          echo "**Date:** $(date -u +"%Y-%m-%d %H:%M:%S UTC")" >> weekly_summary.md
          echo "**Commit:** $(git rev-parse --short HEAD)" >> weekly_summary.md
          echo "" >> weekly_summary.md
          echo "### ✅ Checks Completed" >> weekly_summary.md
          echo "- Full test suite" >> weekly_summary.md
          echo "- Performance benchmarks (3 runs)" >> weekly_summary.md
          echo "- Dead code analysis" >> weekly_summary.md
          echo "- MSRV compatibility (1.70)" >> weekly_summary.md
          echo "- Documentation generation" >> weekly_summary.md
          echo "- Documentation coverage check" >> weekly_summary.md
          echo "" >> weekly_summary.md
          echo "### 📊 Benchmark Summary" >> weekly_summary.md
          if [ -f weekly_benchmark.txt ]; then
            grep -E '(SET|GET).*ops' weekly_benchmark.txt | head -10 >> weekly_summary.md
          fi
          echo "" >> weekly_summary.md
          echo "### 📚 Documentation Coverage" >> weekly_summary.md
          if [ -f doc_coverage.txt ]; then
            tail -20 doc_coverage.txt >> weekly_summary.md
          fi

      - name: Upload weekly report
        uses: actions/upload-artifact@v4
        with:
          name: weekly-maintenance-report
          path: |
            weekly_summary.md
            weekly_benchmark.txt
            msrv_check.txt
            doc_coverage.txt
          retention-days: 90

  security-maintenance:
    name: Security Maintenance
    runs-on: ubuntu-latest
    if: github.event.inputs.maintenance_type == 'security'
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Security audit with cargo-audit
        run: |
          cargo install cargo-audit --locked
          cargo audit --json > audit_report.json
          cargo audit

      - name: Check for yanked dependencies
        run: |
          cargo install cargo-yanked --locked 2>/dev/null || true
          cargo yanked --check || true

      - name: Check for license compliance
        run: |
          cargo install cargo-license --locked 2>/dev/null || true
          cargo license --json > licenses.json || true
          cargo license

      - name: Create security report
        run: |
          echo "## 🔒 Security Maintenance Report" > security_report.md
          echo "" >> security_report.md
          echo "**Date:** $(date -u +"%Y-%m-%d %H:%M:%S UTC")" >> security_report.md
          echo "**Commit:** $(git rev-parse --short HEAD)" >> security_report.md
          echo "" >> security_report.md
          echo "### Audit Results" >> security_report.md
          if [ -f audit_report.json ]; then
            cat audit_report.json | jq -r '.vulnerabilities.found // 0' | xargs -I {} echo "Vulnerabilities found: {}" >> security_report.md
          fi
          echo "" >> security_report.md
          echo "### Yanked Dependencies" >> security_report.md
          cargo yanked --check 2>&1 | head -20 >> security_report.md || echo "No yanked dependencies check available" >> security_report.md

      - name: Upload security report
        uses: actions/upload-artifact@v4
        with:
          name: security-maintenance-report
          path: |
            security_report.md
            audit_report.json
            licenses.json
          retention-days: 90

  dependency-update:
    name: Dependency Update Check
    runs-on: ubuntu-latest
    if: github.event.inputs.maintenance_type == 'dependency-update'
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-depupdate-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-depupdate-

      - name: Check for updates
        run: |
          cargo install cargo-update --locked 2>/dev/null || true
          cargo install cargo-outdated --locked 2>/dev/null || true
          
          echo "## 📦 Dependency Update Report" > dep_update_report.md
          echo "" >> dep_update_report.md
          echo "**Date:** $(date -u +"%Y-%m-%d %H:%M:%S UTC")" >> dep_update_report.md
          echo "**Commit:** $(git rev-parse --short HEAD)" >> dep_update_report.md
          echo "" >> dep_update_report.md
          echo "### Outdated Dependencies" >> dep_update_report.md
          cargo outdated --root-deps-only 2>&1 >> dep_update_report.md || echo "No outdated dependencies or command failed" >> dep_update_report.md
          echo "" >> dep_update_report.md
          echo "### Available Updates (cargo update --dry-run)" >> dep_update_report.md
          cargo update --dry-run 2>&1 >> dep_update_report.md || true

      - name: Test with updated dependencies
        run: |
          # Create a backup of Cargo.lock
          cp Cargo.lock Cargo.lock.backup
          
          # Try updating
          cargo update 2>&1 | tee update_output.txt || true
          
          # Test if build still works
          if cargo build --all-features 2>&1 | tee build_after_update.txt; then
            echo "✅ Build successful with updated dependencies" >> dep_update_report.md
            echo "" >> dep_update_report.md
            echo "### Updated Dependencies" >> dep_update_report.md
            diff Cargo.lock.backup Cargo.lock | grep '^>' | head -30 >> dep_update_report.md || true
          else
            echo "❌ Build failed with updated dependencies" >> dep_update_report.md
            echo "" >> dep_update_report.md
            echo "### Build Error" >> dep_update_report.md
            tail -50 build_after_update.txt >> dep_update_report.md
            # Restore original Cargo.lock
            mv Cargo.lock.backup Cargo.lock
          fi

      - name: Upload dependency update report
        uses: actions/upload-artifact@v4
        with:
          name: dependency-update-report
          path: |
            dep_update_report.md
            update_output.txt
            build_after_update.txt
          retention-days: 90

  ai-code-review:
    name: AI Code Review
    runs-on: ubuntu-latest
    if: github.event.inputs.maintenance_type == 'ai-review'
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-ai-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-ai-

      - name: Run cargo check for context
        run: cargo check --all-features 2>&1 | tee cargo_check.txt

      - name: Get changed files
        run: |
          git diff HEAD~1 --name-only -- '*.rs' > changed_files.txt 2>/dev/null || true
          git diff HEAD~1 -- '*.rs' > code_diff.txt 2>/dev/null || true

      - name: AI Code Review
        if: env.NVIDIA_API_KEY != ''
        env:
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
        run: |
          cat > ai_prompt.txt << 'EOF'
          You are a senior Rust engineer. Review the following code changes and provide:
          1. Performance improvements
          2. Correctness issues
          3. Idiomatic Rust suggestions
          4. Security concerns
          5. Test coverage gaps

          Format as actionable GitHub review comments with file:line references where possible.
          EOF

          # Call NVIDIA API
          curl -s -X POST "https://integrate.api.nvidia.com/v1/chat/completions" \
            -H "Authorization: Bearer ${NVIDIA_API_KEY}" \
            -H "Content-Type: application/json" \
            -d @- << PAYLOAD > ai_review.json
          {
            "model": "nvidia/nemotron-3-ultra-550b-a55b",
            "messages": [
              {"role": "system", "content": "$(cat ai_prompt.txt | sed ':a;N;$!ba;s/\n/\\n/g' | sed 's/"/\\"/g')"},
              {"role": "user", "content": "Code diff:\n$(cat code_diff.txt | sed ':a;N;$!ba;s/\n/\\n/g' | sed 's/"/\\"/g')\n\nCargo check output:\n$(cat cargo_check.txt | sed ':a;N;$!ba;s/\n/\\n/g' | sed 's/"/\\"/g')"}
            ],
            "temperature": 0.3,
            "max_tokens": 4000
          }
          PAYLOAD

      - name: Post AI Review as PR Comment
        if: github.event_name == 'pull_request' && env.NVIDIA_API_KEY != ''
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const review = JSON.parse(fs.readFileSync('ai_review.json', 'utf8'));
            const content = review.choices?.[0]?.message?.content || 'No review generated';
            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `## 🤖 AI Code Review\n\n${content}`
            });

      - name: Upload AI Review Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ai-code-review
          path: ai_review.json
          retention-days: 30

  ai-refactor:
    name: AI Refactoring Analysis
    runs-on: ubuntu-latest
    if: github.event.inputs.maintenance_type == 'ai-refactor' || github.event.schedule == '0 5 * * 0'
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-ai-refactor-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-ai-refactor-

      - name: Collect codebase metrics
        run: |
          cargo install cargo-machete cargo-udeps --locked 2>/dev/null || true
          cargo machete > dead_code.txt 2>&1 || true
          cargo udeps --all-targets > unused_deps.txt 2>&1 || true
          cargo clippy --all-targets --all-features -- -D warnings 2>&1 | head -100 > clippy_warnings.txt || true

      - name: Gather codebase sample
        run: |
          find src -name "*.rs" -size -50k | head -20 | xargs cat > codebase_sample.txt 2>/dev/null || true

      - name: AI Refactoring Analysis
        if: env.NVIDIA_API_KEY != ''
        env:
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
        run: |
          cat > refactor_prompt.txt << 'EOF'
          You are a Rust architecture expert. Analyze the following codebase health data and provide:
          1. Top 5 refactoring priorities with effort/impact estimates
          2. Architectural debt hotspots
          3. Modern Rust patterns to adopt (async, const generics, GATs, etc.)
          4. Dependency modernization opportunities
          5. Test strategy improvements

          Output as prioritized markdown checklist.
          EOF

          curl -s -X POST "https://integrate.api.nvidia.com/v1/chat/completions" \
            -H "Authorization: Bearer ${NVIDIA_API_KEY}" \
            -H "Content-Type: application/json" \
            -d @- << PAYLOAD > refactor_plan.json
          {
            "model": "nvidia/nemotron-3-ultra-550b-a55b",
            "messages": [
              {"role": "system", "content": "$(cat refactor_prompt.txt | sed ':a;N;$!ba;s/\n/\\n/g' | sed 's/"/\\"/g')"},
              {"role": "user", "content": "Dead code:\n$(cat dead_code.txt | sed ':a;N;$!ba;s/\n/\\n/g' | sed 's/"/\\"/g')\n\nUnused deps:\n$(cat unused_deps.txt | sed ':a;N;$!ba;s/\n/\\n/g' | sed 's/"/\\"/g')\n\nClippy warnings:\n$(cat clippy_warnings.txt | sed ':a;N;$!ba;s/\n/\\n/g' | sed 's/"/\\"/g')\n\nCodebase sample:\n$(cat codebase_sample.txt | sed ':a;N;$!ba;s/\n/\\n/g' | sed 's/"/\\"/g')"}
            ],
            "temperature": 0.4,
            "max_tokens": 4000
          }
          PAYLOAD

      - name: Create Refactoring Issue
        if: env.NVIDIA_API_KEY != ''
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const plan = JSON.parse(fs.readFileSync('refactor_plan.json', 'utf8'));
            const content = plan.choices?.[0]?.message?.content || 'No plan generated';
            const { data: issue } = await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `🔧 Weekly AI Refactoring Plan - ${new Date().toISOString().split('T')[0]}`,
              body: content,
              labels: ['refactoring', 'ai-generated', 'maintenance']
            });
            console.log(`Created issue #${issue.number}`);

      - name: Upload Refactoring Plan Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ai-refactoring-plan
          path: |
            refactor_plan.json
            dead_code.txt
            unused_deps.txt
            clippy_warnings.txt
          retention-days: 90

  ai-security:
    name: AI Security Analysis
    runs-on: ubuntu-latest
    if: github.event.inputs.maintenance_type == 'ai-security' || github.event.schedule == '0 3 * * *'
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-ai-sec-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-ai-sec-

      - name: Run security audit
        run: |
          cargo install cargo-audit --locked 2>/dev/null || true
          cargo audit --json > audit_report.json 2>&1 || true
          cargo audit 2>&1 | tee audit_text.txt || true

      - name: Check for unsafe code
        run: |
          grep -r "unsafe" src/ --include="*.rs" | head -50 > unsafe_usage.txt || true

      - name: AI Security Analysis
        if: env.NVIDIA_API_KEY != ''
        env:
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
        run: |
          cat > security_prompt.txt << 'EOF'
          You are a Rust security expert. Analyze the following security data and provide:
          1. Vulnerability assessment (from cargo audit)
          2. Unsafe code review - identify soundness issues
          3. Supply chain risks (transitive dependencies)
          4. Security best practice violations
          5. Recommended fixes with priority

          Output as prioritized markdown checklist with CVE references where applicable.
          EOF

          curl -s -X POST "https://integrate.api.nvidia.com/v1/chat/completions" \
            -H "Authorization: Bearer ${NVIDIA_API_KEY}" \
            -H "Content-Type: application/json" \
            -d @- << PAYLOAD > security_analysis.json
          {
            "model": "nvidia/nemotron-3-ultra-550b-a55b",
            "messages": [
              {"role": "system", "content": "$(cat security_prompt.txt | sed ':a;N;$!ba;s/\n/\\n/g' | sed 's/"/\\"/g')"},
              {"role": "user", "content": "Audit report (JSON):\n$(cat audit_report.json 2>/dev/null | sed ':a;N;$!ba;s/\n/\\n/g' | sed 's/"/\\"/g')\n\nAudit text:\n$(cat audit_text.txt 2>/dev/null | head -200 | sed ':a;N;$!ba;s/\n/\\n/g' | sed 's/"/\\"/g')\n\nUnsafe code locations:\n$(cat unsafe_usage.txt 2>/dev/null | sed ':a;N;$!ba;s/\n/\\n/g' | sed 's/"/\\"/g')"}
            ],
            "temperature": 0.2,
            "max_tokens": 4000
          }
          PAYLOAD

      - name: Create Security Issue
        if: env.NVIDIA_API_KEY != ''
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const analysis = JSON.parse(fs.readFileSync('security_analysis.json', 'utf8'));
            const content = analysis.choices?.[0]?.message?.content || 'No analysis generated';
            const { data: issue } = await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `🔒 AI Security Analysis - ${new Date().toISOString().split('T')[0]}`,
              body: content,
              labels: ['security', 'ai-generated', 'maintenance']
            });
            console.log(`Created issue #${issue.number}`);

      - name: Upload Security Analysis
        uses: actions/upload-artifact@v4
        with:
          name: ai-security-analysis
          path: |
            security_analysis.json
            audit_report.json
            audit_text.txt
            unsafe_usage.txt
          retention-days: 90

  ai-perf:
    name: AI Performance Analysis
    runs-on: ubuntu-latest
    if: github.event.inputs.maintenance_type == 'ai-perf' || github.event.schedule == '0 4 * * 1'
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-ai-perf-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-ai-perf-

      - name: Build release
        run: cargo build --release --all-features

      - name: Run benchmarks
        run: |
          for i in {1..5}; do
            echo "=== Benchmark run $i ==="
            ./target/release/benchmark 2>&1 | tee -a perf_benchmark.txt
          done

      - name: Collect flamegraph data
        run: |
          cargo install flamegraph --locked 2>/dev/null || true
          echo "Flamegraph would require root/sudo, skipping in CI" > flamegraph_note.txt

      - name: Get hot code paths
        run: |
          grep -r "hot\|inline\|fast" src/ --include="*.rs" -i | head -30 > hot_paths.txt || true

      - name: AI Performance Analysis
        if: env.NVIDIA_API_KEY != ''
        env:
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
        run: |
          cat > perf_prompt.txt << 'EOF'
          You are a Rust performance engineer. Analyze the following performance data and provide:
          1. Bottleneck identification from benchmark results
          2. Hot path analysis and optimization opportunities
          3. Memory allocation patterns to improve
          4. Concurrency/contention issues
          5. Specific code changes with expected impact

          Output as prioritized markdown checklist with estimated speedup.
          EOF

          curl -s -X POST "https://integrate.api.nvidia.com/v1/chat/completions" \
            -H "Authorization: Bearer ${NVIDIA_API_KEY}" \
            -H "Content-Type: application/json" \
            -d @- << PAYLOAD > perf_analysis.json
          {
            "model": "nvidia/nemotron-3-ultra-550b-a55b",
            "messages": [
              {"role": "system", "content": "$(cat perf_prompt.txt | sed ':a;N;$!ba;s/\n/\\n/g' | sed 's/"/\\"/g')"},
              {"role": "user", "content": "Benchmark results (5 runs):\n$(cat perf_benchmark.txt 2>/dev/null | sed ':a;N;$!ba;s/\n/\\n/g' | sed 's/"/\\"/g')\n\nHot paths:\n$(cat hot_paths.txt 2>/dev/null | sed ':a;N;$!ba;s/\n/\\n/g' | sed 's/"/\\"/g')\n\nFlamegraph note:\n$(cat flamegraph_note.txt 2>/dev/null)"}
            ],
            "temperature": 0.3,
            "max_tokens": 4000
          }
          PAYLOAD

      - name: Create Performance Issue
        if: env.NVIDIA_API_KEY != ''
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const analysis = JSON.parse(fs.readFileSync('perf_analysis.json', 'utf8'));
            const content = analysis.choices?.[0]?.message?.content || 'No analysis generated';
            const { data: issue } = await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `⚡ AI Performance Analysis - ${new Date().toISOString().split('T')[0]}`,
