      - name: Upload Performance Analysis
        uses: actions/upload-artifact@v4
        with:
          name: ai-performance-analysis
          path: |
            perf_analysis.json
            perf_benchmark.txt
            hot_paths.txt
            flamegraph_note.txt
          retention-days: 90

  ai-tests:
    name: AI Test Analysis & Generation
    runs-on: ubuntu-latest
    if: github.event.inputs.maintenance_type == 'ai-tests' || github.event.schedule == '0 4 * * 3'
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-ai-tests-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-ai-tests-

      - name: Run tests with coverage
        run: |
          cargo install cargo-llvm-cov --locked 2>/dev/null || true
          cargo llvm-cov --all-features --lcov --output-path lcov.info 2>&1 | tee coverage.txt || true
          cargo llvm-cov --all-features --summary-only 2>&1 | tee coverage_summary.txt || true

      - name: Analyze test files
        run: |
          find tests -name "*.rs" -o -name "*.rs" -path "src/*/tests*" | head -20 | xargs cat > existing_tests.txt 2>/dev/null || true
          grep -r "#\[test\]" src/ --include="*.rs" -A 5 | head -100 > unit_tests.txt || true

      - name: AI Test Analysis & Generation
        if: env.NVIDIA_API_KEY != ''
        env:
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
        run: |
          cat > test_prompt.txt << 'EOF'
          You are a Rust testing expert. Analyze the following test data and provide:
          1. Coverage gaps - untested modules/functions
          2. Missing test categories (unit, integration, property, fuzz, chaos)
          3. Test quality issues (flaky, slow, brittle)
          4. New test cases to add with code examples
          4. Property-based testing opportunities
          5. Test infrastructure improvements

          Output as prioritized markdown checklist with example test code.
          EOF

          curl -s -X POST "https://integrate.api.nvidia.com/v1/chat/completions" \
            -H "Authorization: Bearer ${NVIDIA_API_KEY}" \
            -H "Content-Type: application/json" \
            -d @- << PAYLOAD > test_analysis.json
          {
            "model": "nvidia/nemotron-3-ultra-550b-a55b",
            "messages": [
              {"role": "system", "content": "$(cat test_prompt.txt | sed ':a;N;$!ba;s/\n/\\n/g' | sed 's/"/\\"/g')"},
              {"role": "user", "content": "Coverage summary:\n$(cat coverage_summary.txt 2>/dev/null | sed ':a;N;$!ba;s/\n/\\n/g' | sed 's/"/\\"/g')\n\nExisting integration tests:\n$(cat existing_tests.txt 2>/dev/null | head -200 | sed ':a;N;$!ba;s/\n/\\n/g' | sed 's/"/\\"/g')\n\nUnit tests:\n$(cat unit_tests.txt 2>/dev/null | head -200 | sed ':a;N;$!ba;s/\n/\\n/g' | sed 's/"/\\"/g')"}
            ],
            "temperature": 0.4,
            "max_tokens": 4000
          }
          PAYLOAD

      - name: Create Test Improvement Issue
        if: env.NVIDIA_API_KEY != ''
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const analysis = JSON.parse(fs.readFileSync('test_analysis.json', 'utf8'));
            const content = analysis.choices?.[0]?.message?.content || 'No analysis generated';
            const { data: issue } = await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `🧪 AI Test Analysis & Generation - ${new Date().toISOString().split('T')[0]}`,
              body: content,
              labels: ['testing', 'ai-generated', 'maintenance']
            });
            console.log(`Created issue #${issue.number}`);

      - name: Upload Test Analysis
        uses: actions/upload-artifact@v4
        with:
          name: ai-test-analysis
          path: |
            test_analysis.json
            coverage.txt
            coverage_summary.txt
            existing_tests.txt
            unit_tests.txt
          retention-days: 90

  ai-docs:
    name: AI Documentation Analysis & Generation
    runs-on: ubuntu-latest
    if: github.event.inputs.maintenance_type == 'ai-docs' || github.event.schedule == '0 4 * * 5'
