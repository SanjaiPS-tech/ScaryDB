name: Benchmark Pipeline

on:
  push:
    branches: ['*']
    paths:
      - 'src/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/benchmark.yml'
  pull_request:
    branches: ['*']
    paths:
      - 'src/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
  workflow_dispatch:
    inputs:
      runs:
        description: 'Number of benchmark runs'
        required: false
        default: '5'
        type: choice
        options:
          - '3'
          - '5'
          - '10'
          - '20'

env:
  CARGO_TERM_COLOR: always
  BENCHMARK_RUNS: ${{ github.event.inputs.runs || '5' }}

jobs:
  benchmark:
    name: Performance Benchmark
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-bench-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-bench-

      - name: Build release
        run: cargo build --release --all-features

      - name: Run benchmark
        id: bench
        run: |
          echo "Running benchmark with ${{ env.BENCHMARK_RUNS }} runs..."
          
          # Run the benchmark binary multiple times
          for i in $(seq 1 ${{ env.BENCHMARK_RUNS }}); do
            echo "=== Run $i ==="
            ./target/release/benchmark 2>&1 | tee -a benchmark_output.txt
            echo ""
          done
          
          # Extract metrics from output
          SET_OPS=$(grep -oP 'SET\s+\K[\d,]+\.?\d*' benchmark_output.txt | tr -d ',' | awk '{sum+=$1} END {if (NR>0) print sum/NR; else print 0}')
          GET_OPS=$(grep -oP 'GET\s+\K[\d,]+\.?\d*' benchmark_output.txt | tr -d ',' | awk '{sum+=$1} END {if (NR>0) print sum/NR; else print 0}')
          
          # Fallback: look for ops/sec patterns
          if [ -z "$SET_OPS" ] || [ "$SET_OPS" = "0" ]; then
            SET_OPS=$(grep -i 'set.*ops' benchmark_output.txt | grep -oP '[\d,]+\.?\d*' | tr -d ',' | awk '{sum+=$1} END {if (NR>0) print sum/NR; else print 0}')
          fi
          if [ -z "$GET_OPS" ] || [ "$GET_OPS" = "0" ]; then
            GET_OPS=$(grep -i 'get.*ops' benchmark_output.txt | grep -oP '[\d,]+\.?\d*' | tr -d ',' | awk '{sum+=$1} END {if (NR>0) print sum/NR; else print 0}')
          fi
          
          echo "set_ops_avg=$SET_OPS" >> $GITHUB_OUTPUT
          echo "get_ops_avg=$GET_OPS" >> $GITHUB_OUTPUT
          
          echo "Average SET ops/sec: $SET_OPS"
          echo "Average GET ops/sec: $GET_OPS"

      - name: Compare with baseline
        if: github.event_name == 'pull_request'
        run: |
          # Try to get baseline from main branch
          git fetch origin main:main 2>/dev/null || true
          
          if git show main:README.md 2>/dev/null | grep -q "ops/sec"; then
            BASELINE_SET=$(git show main:README.md | grep -oP 'SET\s+~?\s*\K[\d,]+\.?\d*' | head -1 | tr -d ',')
            BASELINE_GET=$(git show main:README.md | grep -oP 'GET\s+~?\s*\K[\d,]+\.?\d*' | head -1 | tr -d ',')
            
            if [ -n "$BASELINE_SET" ] && [ -n "$BASELINE_GET" ]; then
              CURRENT_SET=${{ steps.bench.outputs.set_ops_avg }}
              CURRENT_GET=${{ steps.bench.outputs.get_ops_avg }}
              
              SET_REGRESSION=$(echo "scale=2; (($BASELINE_SET - $CURRENT_SET) / $BASELINE_SET) * 100" | bc -l)
              GET_REGRESSION=$(echo "scale=2; (($BASELINE_GET - $CURRENT_GET) / $BASELINE_GET) * 100" | bc -l)
              
              echo "Baseline SET: $BASELINE_SET, Current SET: $CURRENT_SET"
              echo "Baseline GET: $BASELINE_GET, Current GET: $CURRENT_GET"
              echo "SET regression: ${SET_REGRESSION}%"
              echo "GET regression: ${GET_REGRESSION}%"
              
              # Fail if regression > 10%
              SET_REGRESSION_INT=$(echo "$SET_REGRESSION" | cut -d. -f1)
              GET_REGRESSION_INT=$(echo "$GET_REGRESSION" | cut -d. -f1)
              
              if [ "${SET_REGRESSION_INT:-0}" -gt 10 ] || [ "${GET_REGRESSION_INT:-0}" -gt 10 ]; then
                echo "⚠️ Performance regression detected (>10%)"
                exit 1
              else
                echo "✅ No significant regression detected"
              fi
            fi
          else
            echo "No baseline found in main branch README"
          fi

      - name: Comment benchmark results
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const setOps = '${{ steps.bench.outputs.set_ops_avg }}';
            const getOps = '${{ steps.bench.outputs.get_ops_avg }}';
            
            const body = `## 📊 Benchmark Results
            
            | Metric | Average Ops/sec |
            |--------|----------------|
            | **SET** | ${parseFloat(setOps).toLocaleString()} |
            | **GET** | ${parseFloat(getOps).toLocaleString()} |
            
            *Runs: ${{ env.BENCHMARK_RUNS }}*
            *Commit: ${{ github.sha }}*`;
            
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: body
            });

      - name: Upload benchmark artifacts
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results
          path: benchmark_output.txt
          retention-days: 30

  benchmark-history:
    name: Benchmark History
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: benchmark
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Update benchmark history
        run: |
          # Create/update a benchmark history file
          DATE=$(date -u +"%Y-%m-%d %H:%M:%S UTC")
          COMMIT=$(git rev-parse --short HEAD)
          SET_OPS=${{ needs.benchmark.outputs.set_ops_avg }}
          GET_OPS=${{ needs.benchmark.outputs.get_ops_avg }}
          
          echo "$DATE,$COMMIT,$SET_OPS,$GET_OPS" >> benchmark_history.csv
          
          # Keep last 100 entries
          tail -100 benchmark_history.csv > benchmark_history.csv.tmp && mv benchmark_history.csv.tmp benchmark_history.csv
          
          cat benchmark_history.csv

      - name: Commit benchmark history
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add benchmark_history.csv
          git commit -m "chore: update benchmark history [skip ci]" || echo "No changes to commit"
          git push origin HEAD:main