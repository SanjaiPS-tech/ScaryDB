server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: scarydb
    static_configs:
      - targets:
          - localhost
        labels:
          job: scarydb
          __path__: /app/data/*.log
    pipeline_stages:
      - json:
          expressions:
            timestamp: timestamp
            level: level
            message: fields.message
            target: target
            thread: threadName
      - timestamp:
          source: timestamp
          format: RFC3339Nano
      - labels:
          level:
          target:
          thread: