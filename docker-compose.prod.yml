version: '3.8'

# ScaryDB Production Stack with Monitoring
# Usage: docker-compose -f docker-compose.yml -f docker-compose.prod.yml up -d

services:
  scarydb:
    build:
      context: .
      dockerfile: Dockerfile
    image: scarydb:prod
    container_name: scarydb
    ports:
      - "6379:6379"
    volumes:
      - scarydb-data:/app/data
      - ./config.json:/app/config.json:ro
      - ./certs:/app/certs:ro
    environment:
      - RUST_LOG=info
    healthcheck:
      test: ["CMD", "/app/scurydb", "--version"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: '2'
        reservations:
          memory: 512M
          cpus: '0.5'
    networks:
      - scarydb-network

  # Prometheus for metrics collection
  prometheus:
    image: prom/prometheus:v2.47.0
    container_name: scarydb-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
    restart: unless-stopped
    networks:
      - scarydb-network

  # Grafana for dashboards
  grafana:
    image: grafana/grafana:10.1.0
    container_name: scarydb-grafana
    ports:
      - "3000:3000"
    volumes:
      - ./monitoring/grafana/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./monitoring/grafana/datasources:/etc/grafana/provisioning/datasources:ro
      - grafana-data:/var/lib/grafana
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=changeme
      - GF_USERS_ALLOW_SIGN_UP=false
    restart: unless-stopped
    networks:
      - scarydb-network
    depends_on:
      - prometheus

  # Loki for log aggregation
  loki:
    image: grafana/loki:2.9.0
    container_name: scarydb-loki
    ports:
      - "3100:3100"
    volumes:
      - ./monitoring/loki-config.yml:/etc/loki/local-config.yaml:ro
      - loki-data:/loki
    command: -config.file=/etc/loki/local-config.yaml
    restart: unless-stopped
    networks:
      - scarydb-network

  # Promtail for log shipping
  promtail:
    image: grafana/promtail:2.9.0
    container_name: scarydb-promtail
    volumes:
      - ./monitoring/promtail-config.yml:/etc/promtail/config.yml:ro
      - scarydb-data:/app/data:ro
    command: -config.file=/etc/promtail/config.yml
    restart: unless-stopped
    networks:
      - scarydb-network
    depends_on:
      - loki
      - scarydb

volumes:
  scarydb-data:
    driver: local
  prometheus-data:
    driver: local
  grafana-data:
    driver: local
  loki-data:
    driver: local

networks:
  scarydb-network:
    driver: bridge